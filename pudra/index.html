<div class="card list"><div class="li">Ролик «Три ошибки…»<span class="r">−10</span></div><div class="li">Подарок за регистрацию<span class="r">+10</span></div><div class="li">Пополнение 10 роликов<span class="r">+100</span></div></div>
</div>${tabbar('balance')}`;

const grp=[['key','Аккаунт и вход','Яндекс ID','account'],['star','Мои стили','2 стиля','mystyles'],['bell','Уведомления','Браузер и Telegram','notif'],['card','Оплата и чеки','','balance'],['brush','Оформление','Тема и текст','look'],['help','Помощь','',''],['doc','Документы','Оферта, политика','']];
sc.profile=`${SB}<div class="body">
<div class="hd"><div class="row"><span class="av">А</span><div><b class="h3">Анна</b><p class="sm mut">Цветарий · вход через Яндекс ID</p></div></div><button class="chip" data-theme-toggle aria-label="Тема">${ic('moon','style="width:18px"')}</button></div>
<button class="ref" data-sheet="invite"><img src="${IMG('ikonka-podarok')}" alt=""><div style="flex:1"><b>Пригласить подругу</b><p class="sm" style="opacity:.8">+10 кредитов вам обеим</p></div>${ic('chev')}</button>
<div class="card list">${grp.map(([i,a,b,g])=>`<button class="li" ${g?(['account','notif','look'].includes(g)?`data-sheet="${g}"`:`data-go="${g}"`):''}>${ic(i)}<b style="font-size:15px">${a}</b><span class="r">${b}${ic('chev','style="width:16px;height:16px"')}</span></button>`).join('')}</div>
<button class="sm mut" data-go="landing" style="background:none;border:0">Выйти</button>
</div>${tabbar('profile')}`;

sc.mystyles=`${SB}<div class="body"><div class="wzh"><button class="back" data-back aria-label="Назад">${ic('back')}</button><h2 class="disp h2">Мои стили</h2></div>
<p class="mut">Сохраните стиль после удачного ролика. Измените его здесь, и новые ролики выйдут уже в обновлённом виде.</p>
${[['stil-yagoda-zh','Цветарий весна','Ягода · Плотный · снизу · «Напишите нам»'],['stil-terrakota-zh','Мастер-класс','Терракота · Элегантный · по центру']].map(([f,n,d])=>`<div class="card pad row" style="gap:14px"><img class="img" src="${IMG(f)}" alt="" style="width:64px;aspect-ratio:9/14"><div style="flex:1"><b>${n}</b><p class="sm mut">${d}</p></div><button class="chip" data-sheet="editstyle">${ic('edit','style="width:14px"')}Изменить</button></div>`).join('')}
<button class="btn ghost" data-toast="Стиль сохранится после следующего ролика">${ic('plus')}Новый стиль</button>
</div>`;

const SHEETS={
 phone:`<b class="h3">Вход по номеру</b><input class="inp" value="+7 " aria-label="Телефон"><input class="inp" placeholder="Код из СМС (в демо 000000)" aria-label="Код"><button class="btn" data-go="home" data-close>Войти</button>`,
 edit:`<b class="h3">Поправить ролик</b><p class="mut sm">Без новой загрузки. Стоимость правки: 2 кредита.</p><div class="row wrap"><button class="chip on">Другой стиль</button><button class="chip">Новое начало</button><button class="chip">Другой финал</button><button class="chip">Исправить слово</button><button class="chip">Убрать кусок</button><button class="chip">Вернуть вырезанное</button></div><button class="btn" data-go="progress" data-close>Пересобрать за 2 кредита</button>`,
 invite:`<b class="h3">Пригласите подругу</b><p class="mut sm">Когда она смонтирует первый ролик, вы обе получите по 10 кредитов.</p><div class="inp">ролико.рф/?r=ANNA20</div><button class="btn" data-toast="Ссылка скопирована" data-close>Скопировать ссылку</button>`,
 how:`<b class="h3">Как считаем</b><div class="card list"><div class="li">Ролик до 1 минуты<span class="r">10 кредитов</span></div><div class="li">Ролик 1–3 минуты<span class="r">20 кредитов</span></div><div class="li">Длинное видео до 15 мин<span class="r">40 кредитов</span></div><div class="li">Правка готового ролика<span class="r">2 кредита</span></div></div><p class="sm mut">Если монтаж не получился по нашей вине, кредиты вернутся сами.</p>`,
 pay:`<b class="h3">Оплата</b><p class="mut sm" id="paytxt">25 роликов · 3 225 ₽</p><button class="btn" data-toast="Демо: оплата не выполняется" data-close>Оплатить картой или СБП</button><p class="sm mut">Чек придёт на почту. Без подписки и автосписаний.</p>`,
 account:`<b class="h3">Аккаунт и вход</b><p class="mut sm">Привяжите второй способ входа, чтобы не потерять ролики.</p><div class="card list"><div class="li">Яндекс ID<span class="r">подключён ✓</span></div><div class="li">VK ID<span class="r">привязать</span></div><div class="li">Телефон<span class="r">привязать</span></div><div class="li">Telegram<span class="r">привязать</span></div></div>`,
 notif:`<b class="h3">Уведомления</b><div class="card list"><div class="li">В браузере<button class="sw" role="switch" aria-checked="true" aria-label="В браузере"></button></div><div class="li">В Telegram<button class="sw" role="switch" aria-checked="true" aria-label="В Telegram"></button></div></div><p class="sm mut">По умолчанию включено и то, и другое.</p>`,
 look:`<b class="h3">Оформление</b><div class="ttl">Тема</div><div class="row" data-group="mode"><button class="chip on" data-mode="auto">Авто</button><button class="chip" data-mode="day">${ic('sun','style="width:16px"')}День</button><button class="chip" data-mode="night">${ic('moon','style="width:16px"')}Ночь</button></div><div class="ttl">Размер текста</div><div class="row" data-group="fs"><button class="chip on" data-fs="15">Обычный</button><button class="chip" data-fs="17">Крупный</button></div><p class="sm mut">Крупный текст удобнее, если мелкий трудно читать.</p>`,
 editstyle:`<b class="h3">Цветарий весна</b><div class="ttl">Стиль</div><div class="row wrap"><button class="chip on">Ягода</button><button class="chip">Терракота</button><button class="chip">Холод</button><button class="chip">Фура</button></div><div class="ttl">Шрифт</div><div class="row wrap"><button class="chip on">Плотный</button><button class="chip">Мягкий</button><button class="chip">Элегантный</button><button class="chip">Рукописный</button></div><div class="ttl">Призыв</div><input class="inp" value="Напишите «БУКЕТ» в директ" aria-label="Призыв"><button class="btn" data-toast="Стиль обновлён" data-close>Сохранить</button>`
};

const app=document.getElementById('app');
app.innerHTML=Object.entries(sc).map(([k,v])=>`<section class="scr${v.includes('class="tabs"')?' withtab':''}" data-s="${k}">${v}</section>`).join('')+
 `<div class="sheet" id="sheet"><div class="in"><div class="grab"></div><div id="sheetc" style="display:flex;flex-direction:column;gap:12px"></div></div></div>`+
 `<div class="full" id="full"><img src="${IMG('glavnaya-posle-titry')}" alt="Ролик на весь экран"><button class="x" data-closefull aria-label="Закрыть">×</button></div><div class="toast" id="toast"></div>`;

let cur='landing',hist=[],timer=null;
function go(s,push=true){if(!sc[s])return;if(push&&s!==cur)hist.push(cur);cur=s;
  app.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.dataset.s===s));
  const b=app.querySelector(`.scr[data-s="${s}"] .body`);if(b)b.scrollTop=0;
  if(s==='sum')fillSum(); if(s==='progress')runProgress(); else clearInterval(timer);}
const state={fmt:'Reels · 9:16',shoot:'Говорю в камеру',style:'Ягода',font:'Плотный, снизу',hook:'Подберём за вас',cta:'Напишите «БУКЕТ»'};
function fillSum(){const rows=[['Видео',`${uploaded.length} ${uploaded.length===1?'файл':uploaded.length<5?'файла':'файлов'}`,'create'],['Куда',state.fmt,'w1'],['Съёмка',state.shoot,'w2'],['Стиль',state.style,'w3'],['Шрифт',state.font,'w4'],['Начало',state.hook,'w5'],['Финал',state.cta,'w6']];
  document.getElementById('sumlist').innerHTML=rows.map(([a,b,g])=>`<button class="li" data-go="${g}"><span class="mut">${a}</span><span class="r"><b style="color:var(--p-ink);font-size:14px">${b}</b>${ic('chev','style="width:16px;height:16px"')}</span></button>`).join('');}
function runProgress(){let i=0;const els=[...document.querySelectorAll('#stages .step')];const st=document.getElementById('stage');
  const upd=()=>{els.forEach((e,k)=>{e.className='step '+(k<i?'done':k===i?'now':'wait');e.querySelector('i').innerHTML=k<i?ic('check','style="width:14px;height:14px"'):k+1});st.textContent=i<5?stages[i]:'Готово';};
  upd();clearInterval(timer);timer=setInterval(()=>{i++;upd();if(i>=5){clearInterval(timer);setTimeout(()=>cur==='progress'&&go('ready'),600)}},1100);}
function cells(){const c=document.getElementById('cells');let h=uploaded.map((f,k)=>`<div class="cell"><img src="${IMG(f)}" alt=""><span class="badge">0:${48+k*3}</span><button class="x" data-del="${k}" aria-label="Убрать видео">×</button></div>`).join('');
  if(uploaded.length<5)h+=`<button class="cell add" id="addv" aria-label="Добавить видео">${ic('plus','style="width:30px;height:30px"')}</button>`;
  for(let i=uploaded.length+1;i<5;i++)h+=`<div class="cell"></div>`;
  h+=`<div class="cell" style="border:0;background:transparent;text-align:center;font-size:12px;padding:4px">Вертикально или горизонтально, до 15 мин</div>`;
  c.innerHTML=h;document.getElementById('cnt').textContent=`${uploaded.length} / 5`;}
const ZONES={reels:[['top:0;height:12%'],['bottom:0;height:22%'],['right:0;left:auto;top:45%;bottom:22%;width:16%']],stories:[['top:0;height:14%'],['bottom:0;height:18%']],feed:[['bottom:0;height:12%']],long:[['bottom:0;height:14%']]};
const ZT={reels:'Заштриховано то, что закрывает Reels: ник, подпись, кнопки справа. Титры ставим в чистую зону.',stories:'В Stories сверху полоска и имя, снизу поле ответа. Текст поднимем повыше.',feed:'В ленте 4:5 снизу подпись под видео. Важное держим выше.',long:'В длинном видео снизу полоса плеера. Титры чуть выше неё.'};
function zone(z){const el=document.getElementById('zone');el.style.aspectRatio=z==='feed'?'4/5':z==='long'?'16/9':'9/16';el.style.width=z==='long'?'120px':'86px';el.innerHTML=ZONES[z].map(s=>`<i style="${s[0]}"></i>`).join('');document.getElementById('ztxt').textContent=ZT[z];}
function sheet(n){document.getElementById('sheetc').innerHTML=SHEETS[n];document.getElementById('sheet').classList.add('on');
  if(n==='pay'){const p=app.querySelector('[data-group="pack"] .on');document.getElementById('paytxt').textContent=p.querySelector('b').textContent+' · '+p.dataset.sum+' ₽';}}
function closeSheet(){document.getElementById('sheet').classList.remove('on')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
let mode='day';
function setMode(m){mode=m;const night=m==='night'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);app.dataset.mode=night?'night':'day';
  app.querySelectorAll('[data-theme-toggle]').forEach(b=>b.innerHTML=ic(night?'sun':'moon','style="width:18px"'));}

app.addEventListener('click',e=>{const t=e.target.closest('button,[data-go]');if(!t||!app.contains(t))return;
  if(e.target===document.getElementById('sheet')){closeSheet();return}
  if(t.dataset.del!==undefined){pool.push(uploaded.splice(+t.dataset.del,1)[0]);cells();return}
  if(t.id==='addv'){if(pool.length)uploaded.push(pool.shift());cells();return}
  if(t.id==='sharebtn'){const m=document.getElementById('menu');m.hidden=!m.hidden;t.setAttribute('aria-expanded',String(!m.hidden));return}
  if(t.hasAttribute('data-theme-toggle')){setMode(app.dataset.mode==='night'?'day':'night');return}
  if(t.matches('.sw')){t.setAttribute('aria-checked',String(t.getAttribute('aria-checked')!=='true'));return}
  if(t.dataset.closefull!==undefined){document.getElementById('full').classList.remove('on');return}
  const g=t.closest('[data-group]');
  if(g&&!t.dataset.go&&!t.dataset.sheet){g.querySelectorAll(':scope > button,.on').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    const k=g.dataset.group;
    if(k==='fmt'){state.fmt=t.querySelector('b').textContent.replace(' и Shorts','');zone(t.dataset.z)}
    if(k==='shoot')state.shoot=t.querySelector('.lab').textContent;
    if(k==='style')state.style=t.querySelector('.lab').firstChild.textContent;
    if(k==='font'){const ti=document.getElementById('tit');ti.style.font=t.dataset.font;state.font=t.querySelector('span').textContent+(state.font.includes('центру')?', по центру':', снизу')}
    if(k==='pos'){const ti=document.getElementById('tit');const c=t.dataset.pos==='center';ti.style.bottom=c?'auto':'22px';ti.style.top=c?'42%':'auto';state.font=state.font.split(',')[0]+(c?', по центру':', снизу')}
    if(k==='hook'){document.getElementById('hookphrase').hidden=t.dataset.h!=='phrase';state.hook={auto:'Подберём за вас',phrase:'Своя фраза',none:'Как снято'}[t.dataset.h]}
    if(k==='cta'){const c=t.dataset.c,ov=document.getElementById('ctaov'),inp=document.getElementById('ctain');ov.hidden=c==='-';inp.hidden=c==='-';if(c&&c!=='-'){inp.value=c;ov.textContent=c}if(c==='')inp.focus();state.cta=c==='-'?'Без призыва':inp.value.replace(' в директ','').replace(', чтобы не пропустить','')}
    if(k==='pack')document.getElementById('paybtn').textContent='Пополнить на '+t.dataset.sum+' ₽';
    if(k==='mode')setMode(t.dataset.mode);
    if(k==='fs')app.style.fontSize=t.dataset.fs+'px';
    return}
  if(t.dataset.toast)toast(t.dataset.toast);
  if(t.dataset.close!==undefined)closeSheet();
  if(t.dataset.sheet){sheet(t.dataset.sheet);return}
  if(t.hasAttribute('data-back')){go(hist.pop()||'home',false);return}
  if(t.dataset.go){closeSheet();const m=document.getElementById('menu');if(m)m.hidden=true;go(t.dataset.go)}
});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.getElementById('ctain').addEventListener('input',e=>{document.getElementById('ctaov').textContent=e.target.value;state.cta=e.target.value});
document.getElementById('vid').addEventListener('dblclick',()=>document.getElementById('full').classList.add('on'));
let lastTap=0;document.getElementById('vid').addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<320){e.preventDefault();document.getElementById('full').classList.add('on')}lastTap=n});
/* до/после: шторка сама ходит, пока не тронули */
const ba=document.getElementById('ba'),r=document.getElementById('ba-r');let auto=true,ph=0;
r.addEventListener('input',()=>{auto=false;ba.style.setProperty('--cut',r.value+'%')});
(function loop(){if(auto&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ph+=.012;const v=50+38*Math.sin(ph);ba.style.setProperty('--cut',v+'%');r.value=v}requestAnimationFrame(loop)})();
cells();zone('reels');setMode('day');
const start=(location.hash.match(/^#([a-z0-9]+)$/)||[])[1];go(sc[start]?start:'landing',false);
</script>
